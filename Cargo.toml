[package]
name = "agentsync"
# Equal to VERSION: `agentsync release` bumps both, and src/lib.rs tests the pair.
version = "0.36.0"
edition = "2024"
rust-version = "1.85"
description = "Sync AI agent instructions from .ai/src/ to every tool."
license = "GPL-3.0-only"
repository = "https://github.com/yelmuratoff/agent"
publish = false

[dependencies]
clap = { version = "4.6", features = ["derive"] }
include_dir = "0.7"
sha2 = { version = "0.11", default-features = false }
signal-hook = { version = "0.4", default-features = false }
thiserror = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
codegen-units = 1
lto = true
strip = true
